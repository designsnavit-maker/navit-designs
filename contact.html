  <meta property="og:title" content="צור קשר – נוית">

  <meta property="og:type" content="website">

  <link rel="icon" href="images/ui/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/ui/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/ui/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;900&family=Playpen+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
<div data-render="header"></div>
<main id="main">
<section class="page-head">
  <div class="page-head-deco deco" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
  <div class="wrap" style="position:relative">
    <span class="kicker">צור קשר</span>
    <h1>בואו <span class="cutout" style="--r:1.2deg;background:var(--peach)">נדבר</span></h1>
    <p class="lead" data-text="texts.closingText"></p>
    
  </div>
</section>
<section class="band torn-top">
  <div class="wrap two-col">
    <div class="reveal">
      <h2>הדרך הכי מהירה</h2>
      <ul class="contact-list" data-render="contact-list"></ul>
      <a class="btn btn-wa" data-wa="היי נוית 😊"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.4 6.4 0 0 0 1.3 3.4 14.7 14.7 0 0 0 5.6 5c2.1.9 2.9 1 4 .8.6-.1 1.9-.8 2.2-1.6s.3-1.4.2-1.6-.3-.2-.6-.4z"/></svg> לכתוב לי בוואטסאפ</a>
    </div>
    <form class="form reveal tape" id="contact-form" novalidate>
      <h2 class="full" style="font-size:1.8rem;margin:0">או השאירו פרטים</h2>
      <label>שם<input name="name" autocomplete="name" required></label>
      <label>טלפון<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
      <label class="full">במה אפשר לעזור?
        <select name="type" id="f-type">
          <option value="יום הולדת לילדים">יום הולדת לילדים</option>
          <option value="ערב נשים / קבוצה פרטית">ערב נשים / קבוצה פרטית</option>
          <option value="סדנה פתוחה בבאר טוביה">סדנה פתוחה בבאר טוביה</option>
          <option value="אירוע פרטי">אירוע פרטי</option>
          <option value="ארגון / מוסד">ארגון / מוסד</option>
          <option value="הזמנת הדפס / גלויה">הזמנת הדפס / גלויה</option>
          <option value="אחר">אחר</option>
        </select></label>
      <label>תאריך משוער<input name="date" type="text" placeholder="למשל: סוף נובמבר"></label>
      <label>מספר משתתפים<input name="people" type="number" min="1" inputmode="numeric"></label>
      <label class="full">הודעה<textarea name="message" placeholder="ספרו לי קצת…"></textarea></label>
      <div class="full" style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center">
        <button class="btn" type="submit">שליחה</button>
        <span class="hint">בשלב זה השליחה פותחת וואטסאפ עם הפרטים שמילאתם.</span>
      </div>
    </form>
  </div>
</section>

</main>
<div data-render="footer"></div>
<dialog class="modal" id="work-modal" aria-labelledby="modal-title"><button class="modal-close" aria-label="סגירה">×</button><div class="modal-content"></div></dialog>
<noscript><p style="padding:1rem;text-align:center">כדי לראות את האתר במלואו יש להפעיל JavaScript.</p></noscript>
<!-- כל התוכן נמצא ב-content.js -->
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
